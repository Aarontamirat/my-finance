<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Altrack - Personal Finance & Expense Tracker</title>
    <meta
      name="description"
      content="A sleek, modern Personal Finance & Expense Tracker with multi-account management, cash flow analytics, smart budgets, recurring bills, and savings goal trackers."
    />
    <meta
      property="og:title"
      content="Altrack - Personal Finance & Expense Tracker"
    />
    <meta
      property="og:description"
      content="A sleek, modern Personal Finance & Expense Tracker with multi-account management, cash flow analytics, smart budgets, recurring bills, and savings goal trackers."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("altrack_theme_v1");
          var theme = saved || "dark";
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body
    class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-400"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
